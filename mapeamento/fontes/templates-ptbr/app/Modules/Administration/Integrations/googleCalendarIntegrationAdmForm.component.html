<div class="vbox header-or-footer" ng-form="integration_form">
  <standard-loader margin-top="'15'" loading="!googleCalendarIntegrationAdmFormCtrl.initial_load"></standard-loader>
  <section class="scrollable" ng-if="googleCalendarIntegrationAdmFormCtrl.initial_load">
    <div class="white-content b-b-1 wrapper">
      <div class="gap-15"></div>
      <div>
        <div class="hbox">
          <aside class="width-10 text-center">
            <div class="side-wrapper">
              <img class="avatar-select" ng-src="{{googleCalendarIntegrationAdmFormCtrl.integration.ImageUrl}}">
            </div>
          </aside>
          <aside>
            <div class="side-wrapper">
              <div class="mtop3" ng-bind-html="googleCalendarIntegrationAdmFormCtrl.integration.Description | to_trusted"></div>
            </div>
          </aside>
        </div>
      </div>
      <div class="gap-15"></div>
    </div>
    <div class="gap-15"></div>

    <div class="wrapper">
      <div class="text-center">
        <a class="button button-big button-action" ng-click="googleCalendarIntegrationAdmFormCtrl.enableIntegration()" ng-if="googleCalendarIntegrationAdmFormCtrl.account_integration.StatusId !== 1">
          Habilitar integração
        </a>
        <a class="button button-big button-white" ng-click="googleCalendarIntegrationAdmFormCtrl.disableIntegration()" ng-if="googleCalendarIntegrationAdmFormCtrl.account_integration.StatusId === 1">
          <div class="text-danger">
            <i class="fal fa-pause button-icon"></i>
            <span class="text-regular">Desligar integração</span>
          </div>
        </a>
      </div>
    </div>
  </section>
</div>
