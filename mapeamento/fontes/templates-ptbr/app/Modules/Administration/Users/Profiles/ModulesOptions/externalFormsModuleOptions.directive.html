<div class="tab-pane" id="o">
  <form class="clearfix">
    <div class="form-group col-sm-12">
      <div class="font-thin font-title">
        Pode cadastrar formulários externos de cliente?
      </div>
      <div class="line"></div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.ContactPublicFormsCreatePermission" ng-value="true"><strong>Sim</strong>
        </label>
      </div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.ContactPublicFormsCreatePermission" ng-value="false"><strong>Não</strong>
        </label>
      </div>
    </div>
    <div class="form-group col-sm-12">
      <div class="font-thin font-title">
        Pode cadastrar formulários externos de (name:deal::s)?
      </div>
      <div class="line"></div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.DealPublicFormsCreatePermission" ng-value="true"><strong>Sim</strong>
        </label>
      </div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.DealPublicFormsCreatePermission" ng-value="false"><strong>Não</strong>
        </label>
      </div>
    </div>
  </form>
</div>
