
<div class="tab-pane" id="pr">
  <form class="clearfix">
    <div class="form-group col-sm-12">
      <div class="font-thin font-title">Pode cadastrar novos campos?</div>
      <div class="line"></div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.FieldsCreatePermission" ng-value="true"><strong>Sim</strong>
        </label>
      </div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.FieldsCreatePermission" ng-value="false"><strong>Não</strong>
        </label>
      </div>
    </div>
  </form>
  <form class="clearfix">
    <div class="form-group col-sm-12">
      <div class="font-thin font-title">Pode editar campos?</div>
      <div class="line"></div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.FieldsEditPermission" ng-value="true"><strong>Sim</strong>
        </label>
      </div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.FieldsEditPermission" ng-value="false"><strong>Não</strong>
        </label>
      </div>
    </div>
  </form>
  <form class="clearfix">
    <div class="form-group col-sm-12">
      <div class="font-thin font-title">Pode excluir campos?</div>
      <div class="line"></div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.FieldsDeletePermission" ng-value="true"><strong>Sim</strong>
        </label>
      </div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.FieldsDeletePermission" ng-value="false"><strong>Não</strong>
        </label>
      </div>
    </div>
  </form>
</div>
