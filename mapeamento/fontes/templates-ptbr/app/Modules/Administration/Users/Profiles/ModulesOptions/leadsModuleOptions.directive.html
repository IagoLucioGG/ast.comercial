<div class="tab-pane" id="l">
  <form class="clearfix">
    <div class="form-group col-sm-12">
      <div class="font-thin font-title">
        Tem acesso ao módulo de leads?
      </div>
      <div class="line"></div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.LeadsModule" ng-value="true"><strong>Sim</strong>
        </label>
      </div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.LeadsModule" ng-value="false"><strong>Não</strong>
        </label>
      </div>
    </div>
    <div class="form-group col-sm-12">
      <div class="font-thin font-title">
        Leads que pode visualizar
      </div>
      <div class="line"></div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.LeadsView" ng-value="4"><strong>Nenhum</strong>
        </label>
      </div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.LeadsView" ng-value="3"><strong>Apenas sob sua responsabilidade/colaboração</strong>
        </label>
      </div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.LeadsView" ng-value="2"><strong>Sob sua responsabilidade/colaboração ou sob responsabilidade de membros da sua equipe</strong>
        </label>
      </div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.LeadsView" ng-value="1"><strong>Todos</strong>
        </label>
      </div>
    </div>
    <div class="form-group col-sm-12">
      <div class="font-thin font-title">
        Leads que pode editar
      </div>
      <div class="line"></div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.LeadsEdit" ng-value="4"><strong>Nenhum</strong>
        </label>
      </div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.LeadsEdit" ng-value="3"><strong>Apenas sob sua responsabilidade/colaboração</strong>
        </label>
      </div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.LeadsEdit" ng-value="2"><strong>Sob sua responsabilidade/colaboração ou sob responsabilidade de membros da sua equipe</strong>
        </label>
      </div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.LeadsEdit" ng-value="1"><strong>Todos</strong>
        </label>
      </div>
    </div>
    <div class="form-group col-sm-12">
      <div class="font-thin font-title">
        Leads que pode excluir
      </div>
      <div class="line"></div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.LeadsDelete" ng-value="4"><strong>Nenhum</strong>
        </label>
      </div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.LeadsDelete" ng-value="3"><strong>Apenas sob sua responsabilidade/colaboração</strong>
        </label>
      </div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.LeadsDelete" ng-value="2"><strong>Sob sua responsabilidade/colaboração ou sob responsabilidade de membros da sua equipe</strong>
        </label>
      </div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.LeadsDelete" ng-value="1"><strong>Todos</strong>
        </label>
      </div>
    </div>
    <div class="form-group col-sm-12">
      <div class="font-thin font-title">
        Pode cadastrar novos leads?
      </div>
      <div class="line"></div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.LeadsCreatePermission" ng-value="true"><strong>Sim</strong>
        </label>
      </div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.LeadsCreatePermission" ng-value="false"><strong>Não</strong>
        </label>
      </div>
    </div>
    <div class="form-group col-sm-12">
      <div class="font-thin font-title">
        Pode inserir nota nos leads?
      </div>
      <div class="line"></div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.LeadsUpdateStatusPermission" ng-value="true"><strong>Sim</strong>
        </label>
      </div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.LeadsUpdateStatusPermission" ng-value="false"><strong>Não</strong>
        </label>
      </div>
    </div>
  </form>
</div>
