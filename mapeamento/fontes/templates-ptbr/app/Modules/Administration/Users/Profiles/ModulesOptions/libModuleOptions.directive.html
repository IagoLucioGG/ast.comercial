<div class="tab-pane" id="o">
  <form class="clearfix">
    <div class="form-group col-sm-12">
      <div class="font-thin font-title">
        Tem acesso ao módulo de arquivos?
      </div>
      <div class="line"></div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.LibraryModule" ng-value="true"><strong>Sim</strong>
        </label>
      </div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.LibraryModule" ng-value="false"><strong>Não</strong>
        </label>
      </div>
    </div>
    <div class="form-group col-sm-12">
      <div class="font-thin font-title">
        Pode criar pastas-mãe?
      </div>
      <div class="line"></div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.AttachmentBaseFolderCreatePermission" ng-value="true"><strong>Sim</strong>
        </label>
      </div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.AttachmentBaseFolderCreatePermission" ng-value="false"><strong>Não</strong>
        </label>
      </div>
    </div>
  </form>
</div>
