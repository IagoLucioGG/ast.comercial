
<div class="tab-pane" id="pr">
  <form class="clearfix">
    <div class="form-group col-sm-12">
      <div class="font-thin font-title">Tem acesso ao módulo de produtos?</div>
      <div class="line"></div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.ProductsAdministerPermission" ng-value="true"><strong>Sim</strong>
        </label>
      </div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.ProductsAdministerPermission" ng-value="false"><strong>Não</strong>
        </label>
      </div>
    </div>
  </form>
  <form class="clearfix">
    <div class="form-group col-sm-12">
      <div class="font-thin font-title">Pode cadastrar novos produtos, grupos e famílias de produto?</div>
      <div class="line"></div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.ProductsCreatePermission" ng-value="true"><strong>Sim</strong>
        </label>
      </div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.ProductsCreatePermission" ng-value="false"><strong>Não</strong>
        </label>
      </div>
    </div>
  </form>
  <form class="clearfix">
    <div class="form-group col-sm-12">
      <div class="font-thin font-title">Pode editar produtos, grupos e famílias de produto?</div>
      <div class="line"></div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.ProductsEditPermission" ng-value="true"><strong>Sim</strong>
        </label>
      </div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.ProductsEditPermission" ng-value="false"><strong>Não</strong>
        </label>
      </div>
    </div>
  </form>
  <form class="clearfix">
    <div class="form-group col-sm-12">
      <div class="font-thin font-title">Pode excluir produtos, grupos e famílias de produto?</div>
      <div class="line"></div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.ProductsDeletePermission" ng-value="true"><strong>Sim</strong>
        </label>
      </div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.ProductsDeletePermission" ng-value="false"><strong>Não</strong>
        </label>
      </div>
    </div>
  </form>
</div>
