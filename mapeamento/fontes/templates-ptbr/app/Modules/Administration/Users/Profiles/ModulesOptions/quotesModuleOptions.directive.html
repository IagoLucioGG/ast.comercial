<div class="tab-pane" id="o">
  <form class="clearfix">
    <div class="form-group col-sm-12">
      <div class="font-thin font-title">
        Tem acesso ao módulo de propostas?
      </div>
      <div class="line"></div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.QuotesModule" ng-value="true"><strong>Sim</strong>
        </label>
      </div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.QuotesModule" ng-value="false"><strong>Não</strong>
        </label>
      </div>
    </div>
    <div class="form-group col-sm-12">
      <div class="font-thin font-title">
        Pode cadastrar novas propostas?
      </div>
      <div class="line"></div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.QuotesCreatePermission" ng-value="true"><strong>Sim</strong>
        </label>
      </div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.QuotesCreatePermission" ng-value="false"><strong>Não</strong>
        </label>
      </div>
    </div>
    <div class="form-group col-sm-12">
      <div class="font-thin font-title">
        Pode editar propostas?
      </div>
      <div class="line"></div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.QuotesEditPermission"
            ng-value="true"><strong>Sim</strong>
        </label>
      </div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.QuotesEditPermission"
            ng-value="false"><strong>Não</strong>
        </label>
      </div>
    </div>
    <div class="form-group col-sm-12">
      <div class="font-thin font-title">
        Pode excluir propostas?
      </div>
      <div class="line"></div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.QuotesDeletePermission"
            ng-value="true"><strong>Sim</strong>
        </label>
      </div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.QuotesDeletePermission"
            ng-value="false"><strong>Não</strong>
        </label>
      </div>
    </div>
    <div class="form-group col-sm-12">
      <div class="font-thin font-title">
        Pode compartilhar propostas?
      </div>
      <div class="line"></div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.QuoteSharePermission"
            ng-value="true"><strong>Sim</strong>
        </label>
      </div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.QuoteSharePermission"
            ng-value="false"><strong>Não</strong>
        </label>
      </div>
    </div>
  </form>
</div>
