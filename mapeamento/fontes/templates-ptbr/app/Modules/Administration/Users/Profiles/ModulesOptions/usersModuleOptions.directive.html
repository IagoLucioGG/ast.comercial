
<div class="tab-pane" id="pr">
  <form class="clearfix">
    <div class="form-group col-sm-12">
      <div class="font-thin font-title">
        Usuário que pode visualizar
      </div>
      <div class="line"></div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.UsersView" ng-value="1"><strong>Todos</strong>
        </label>
      </div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.UsersView" ng-value="2"><strong>Somente membros da sua equipe</strong>
        </label>
      </div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.UsersView" ng-value="3"><strong>Somente a si</strong>
        </label>
      </div>
    </div>
    <div class="form-group col-sm-12">
      <div class="font-thin font-title">
        Equipes que pode visualizar
      </div>
      <div class="line"></div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.TeamsView" ng-value="1"><strong>Todos</strong>
        </label>
      </div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.TeamsView" ng-value="2"><strong>Somente suas equipes</strong>
        </label>
      </div>
    </div>
    <div class="form-group col-sm-12">
      <div class="font-thin font-title">
        Históricos de navegação que pode visualizar
      </div>
      <div class="line"></div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.LogsViewPermission" ng-value="1"><strong>Todos</strong>
        </label>
      </div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.LogsViewPermission" ng-value="2"><strong>Somente o seu e de membros de sua equipe</strong>
        </label>
      </div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.LogsViewPermission" ng-value="3"><strong>Somente o seu</strong>
        </label>
      </div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.LogsViewPermission" ng-value="4"><strong>Nenhum</strong>
        </label>
      </div>
    </div>
    <div class="form-group col-sm-12" ng-if="usersModuleOptionsCtrl.self.Account.ChatModule">
      <div class="font-thin font-title">
        Usuários que pode conversar pelo chat
      </div>
      <div class="line"></div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.ChatPermission" ng-value="1"><strong>Todos</strong>
        </label>
      </div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.ChatPermission" ng-value="2"><strong>Somente membros da sua equipe</strong>
        </label>
      </div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.ChatPermission" ng-value="4"><strong>Somente usuários específicos</strong>
        </label>
      </div>
      <div>
        <label class="font-bold">
          Selecione usuários específicos que pode conversar
        </label>
        <new-field
          model="model"
          field="usersModuleOptionsCtrl.allowed_chat_users_field"
          property="usersModuleOptionsCtrl.allowed_chat_users_field.key"
          wide="true"
          required="false"
          disabled="model.ChatPermission === 1"
          ignore-default-values="true"
          model-change-callback="usersModuleOptionsCtrl.chatUsersCallback(new_val)"
          not-trigger-formula="true">
        </new-field>
      </div>
    </div>
    <div class="form-group col-sm-12">
      <div class="font-thin font-title">
        Para quem pode enviar mensagens no mural da tela inicial?
      </div>
      <div class="line"></div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.HomeMessagesCreate" ng-value="4"><strong>Ninguém</strong>
        </label>
      </div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.HomeMessagesCreate" ng-value="2"><strong>Somente suas equipes</strong>
        </label>
      </div>
      <div class="radio">
        <label>
          <input class="inline-option" type="radio" ng-model="model.HomeMessagesCreate" ng-value="1"><strong>Todos</strong>
        </label>
      </div>
    </div>
  </form>
</div>
