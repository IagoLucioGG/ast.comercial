<dynamic-modal
  modal-id="contact_product_modal"
  wide="false"
  footer="true"
  dark="true"
  modal-title="{{($ctrl.editing ? 'CONTACTS.CONTACT_PRODUCT_MODAL.EDIT_CONTACT_PRODUCT' : 'CONTACTS.CONTACT_PRODUCT_MODAL.NEW_CONTACT_PRODUCT') | translate_sentence }}"
  toggle-modal="$ctrl.toggle_modal"
  ng-form
  name="contact_product_form"
  is-fetching-modal-content="$ctrl.isFetchingModalContent"
>
  <modal-content>
    <div class="vbox scroll-shadow neutral-shadow">
      <section class="scrollable scroll-shadow-container" ng-if="$ctrl.can_load">
        <ul class="nav nav-tabs b-b-1 gray-border-tabs arrange-mid" ng-if="!$ctrl.editing">
          <li ng-repeat="product_source in $ctrl.product_sources"
            ng-class="{'active': product_source.Id === $ctrl.selected_product_source.Id }"
            ng-click="$ctrl.selectProductSource(product_source)">
            <a class="text-muted" href>{{product_source.Name}}</a>
          </li>
        </ul>
        <product-select
          ng-if="$ctrl.selected_product_source"
          select-callback-fn="$ctrl.selectProduct"
          selected-product-id="$ctrl.editing ? $ctrl.api_contact_product_model.ProductId : null"
          block-changing-product="$ctrl.editing"

          entity-id="$ctrl.selected_product_source.EntityId"
          entity-name="$ctrl.selected_product_source.EntityName"
          entity-endpoint="$ctrl.selected_product_source.EntityEndpoint"
          is-invalid-field="contact_product_form.$submitted && !$ctrl.isProductSelected"
          entity-custom-expands="$ctrl.selected_product_source.EntityCustomExpands"
          entity-custom-filter="$ctrl.selected_product_source.EntityCustomFilter"
          get-showing-table-fields-fn="$ctrl.selected_product_source.ShowingTableFieldsFn">
        </product-select>
        <div class="gap-15"></div>
        <div ng-repeat="section in $ctrl.sections" ng-if="$ctrl.selected_product_source.Id === 1">
          <div ng-if="section.Id === 'null'">
            <forms
              model="$ctrl.contact_product_model"
              fields="$ctrl.forms[$index]"
              form="contact_product_form"
              ignore-default-values="$ctrl.editing"
              formula-trigger-hide-or-disable="true">
            </forms>
            <div class="gap-20"></div>
          </div>
          <div ng-if="section.Id !== 'null'" ng-hide="section.hidden">
            <modal-section section-form="contact_product_form" name="section.name" section-id="section.Id">
              <forms
                model="$ctrl.contact_product_model"
                fields="$ctrl.forms[$index]"
                form="contact_product_form"
                name="'section_form_' + section.Id"
                ignore-default-values="$ctrl.editing"
                formula-trigger-hide-or-disable="true">
              </forms>
            </modal-section>
            <div class="gap-20"></div>
          </div>
        </div>
      </section>
    </div>
  </modal-content>
  <modal-footer>
    <div class="stretch">
      <div class="hbox stretch">
        <aside class="v-middle width-50 text-left">
          <a href class="button button-white" ng-if="$ctrl.editing && $ctrl.has_contact_product_delete_permission" ng-click-confirm="excluir (esse:contact_product:aa:s) (name:contact_product:aa:s)?" ng-click="$ctrl.deleteContactProduct()">
            <span class="font-big">
              <i class="fal fa-trash"></i>
            </span>
          </a>
        </aside>
        <aside class="v-middle">
          <div class="document-footer-container hbox">
            <loading-tooltip loading="$ctrl.loading" form="contact_product_form"></loading-tooltip>
            <button 
              class="button button-white pull-right" 
              ng-if="$ctrl.show_contact_page_button" 
              ui-sref="{{'contact({ contactid: $ctrl.api_contact_product_model.ContactId })'}}" 
              ng-disabled="$ctrl.contactDeleted" 
              ng-class="{ disabled: $ctrl.contactDeleted }"
              uib-tooltip="O cliente d(esse:contact_product:aa:s) (name:contact_product:aa:s) foi excluído"
              tooltip-append-to-body="true"
              tooltip-enable="$ctrl.contactDeleted"
              >
              <span class="text-action"><i class="button-icon fal fa-id-card"></i></span>
              Ir para a tela do cliente
            </button>
            <button class="button button-action pull-right" ng-disabled="$ctrl.loading || $ctrl.disabled_button_save" ng-click="$ctrl.submitControl($ctrl.contact_product_model, contact_product_form)" ng-class="{disabled: $ctrl.loading || $ctrl.disabled_button_save }">
              <i class="button-icon fas fa-save"></i>
              Salvar
            </button>
          </div>
        </aside>
      </div>
    </div>
  </modal-footer>
</dynamic-modal>
