<dynamic-modal
  modal-id="{{::modalId}}"
  wide="false"
  footer="true"
  dark="false"
  modal-title="{{newContactCtrl.buildModalTitle()}}"
  toggle-modal="newContactCtrl.toggle_modal"
  cypress-prefix="{{ type === 'person' ? 'new-person-modal' : 'new-company-modal' }}"
  ng-form name="new_contact_form"
  close-callback="newContactCtrl.closeCallback"
  is-fetching-modal-content="newContactCtrl.isFetchingModalContent"
>
  <modal-content>
    <mdm-duplicates-watcher
      model="newContactCtrl.new_contact"
      forms="newContactCtrl.forms"
      contact-type="type">
    </mdm-duplicates-watcher>
    <div class="vbox scroll-shadow neutral-shadow">
      <section class="scrollable scroll-shadow-container">
        <div class="gap-15"></div>
        <div ng-repeat="section in newContactCtrl.sections">
          <div ng-if="section.Id === 'null'">
            <forms model="newContactCtrl.new_contact" fields="newContactCtrl.forms[$index]" form="new_contact_form" formula-trigger-hide-or-disable="true"></forms>
            <div class="gap-20"></div>
          </div>
          <div ng-if="section.Id !== 'null'" ng-hide="section.hidden">
            <modal-section section-form="new_contact_form" name="section.name" section-id="section.Id">
              <forms model="newContactCtrl.new_contact" fields="newContactCtrl.forms[$index]" form="new_contact_form" formula-trigger-hide-or-disable="true" name="'section_form_' + section.Id"></forms>
            </modal-section>
            <div class="gap-20"></div>
          </div>
        </div>
      </section>
    </div>
  </modal-content>
  <modal-footer>
    <div class="side-wrapper stretch">
      <div class="document-footer-container hbox">
        <loading-tooltip loading="newContactCtrl.loading" form="new_contact_form"></loading-tooltip>
        <button class="button button-action pull-right" ng-disabled="newContactCtrl.loading" ng-click="newContactCtrl.submitControl(newContactCtrl.new_contact, new_contact_form)">
          Salvar
        </button>
      </div>
    </div>
  </modal-footer>
</dynamic-modal>
