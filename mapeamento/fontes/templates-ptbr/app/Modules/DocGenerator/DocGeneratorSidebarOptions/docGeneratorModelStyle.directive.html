<form>
  <div class="font-title font-thin text-darkest-neutral regular-background b-b-1">
    Margens
  </div>
  <div class="gap-10"></div>
  <div class="margins clearfix">
    <div class="form-group col-sm-4 auto-padding">
      <label class="font-regular-weight">
        Lateral
      </label>
      <input class="form-control input-sm" ng-model="model.SideMargin" type="number" ng-model-options="{ debounce: 400 }" ng-change="docGeneratorModelStyleCtrl.checkMinValues()">
    </div>
    <div class="form-group col-sm-4 auto-padding">
      <label class="font-regular-weight">
        Superior
      </label>
      <input class="form-control input-sm" ng-model="model.TopMargin" type="number" ng-model-options="{ debounce: 400 }" ng-change="docGeneratorModelStyleCtrl.checkMinValues()">
    </div>
    <div class="form-group col-sm-4 auto-padding">
      <label class="font-regular-weight">
        Inferior
      </label>
      <input class="form-control input-sm" ng-model="model.BottomMargin" type="number" ng-model-options="{ debounce: 400 }" ng-change="docGeneratorModelStyleCtrl.checkMinValues()">
    </div>
  </div>
  <div class="gap-15"></div>
  <div class="font-title font-thin text-darkest-neutral regular-background b-b-1">
    Estrutura
  </div>
  <div class="gap-10"></div>
  <div class="form-group">
    <label class="font-regular-weight">
      Cabeçalho
    </label>
    <div class="hbox">
      <aside class="v-middle">
        <a class="btn button width-200" ng-class="{'button-action': model.HeaderSourceCode, 'button-neutral': !model.HeaderSourceCode}" ng-click="docGeneratorModelStyleCtrl.editHeader()">
          {{ (model.HeaderSourceCode ? 'DOC_GENERATOR.SIDEBAR.EDIT_HEADER' : 'DOC_GENERATOR.SIDEBAR.ADD_HEADER') | translate }}
        </a>
      </aside>
      <aside class="width-50 v-middle text-right" ng-if="model.HeaderSourceCode">
        <a class="button-fixed-size button-darkest-light-background-border button-fixed-size-big button-circle b-1 text-center" ng-click="docGeneratorModelStyleCtrl.deleteHeader()">
          <span class="text-neutral text-center"><i class="fal fa-trash fixing-fixed-size-button"></i></span>
        </a>
      </aside>
    </div>
  </div>
  <div class="form-group">
    <label class="font-regular-weight">
      Rodapé
    </label>
    <div class="hbox">
      <aside class="v-middle">
        <a class="btn button width-200" ng-class="{'button-action': model.FooterSourceCode, 'button-neutral': !model.FooterSourceCode}" ng-click="docGeneratorModelStyleCtrl.editFooter()">
          {{ (model.FooterSourceCode ? 'DOC_GENERATOR.SIDEBAR.EDIT_FOOTER' : 'DOC_GENERATOR.SIDEBAR.ADD_FOOTER') | translate }}
        </a>
      </aside>
      <aside class="width-50 v-middle text-right" ng-if="model.FooterSourceCode">
        <a class="button-fixed-size button-darkest-light-background-border button-fixed-size-big button-circle b-1 text-center" ng-click="docGeneratorModelStyleCtrl.deleteFooter()">
          <span class="text-neutral text-center"><i class="fal fa-trash fixing-fixed-size-button"></i></span>
        </a>
      </aside>
    </div>
  </div>
</form>
