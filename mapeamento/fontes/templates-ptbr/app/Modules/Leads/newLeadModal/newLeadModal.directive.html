<dynamic-modal
  modal-id="{{::modalId}}"
  wide="false"
  footer="true"
  dark="true"
  modal-title="Novo Lead"
  toggle-modal="newLeadModalCtrl.toggle_modal"
  ng-form
  name="new_lead_form"
  is-fetching-modal-content="$ctrl.isFetchingModalContent"
>
  <modal-content>
    <div class="vbox scroll-shadow neutral-shadow">
      <section class="scrollable scroll-shadow-container">
        <div class="gap-15"></div>
        <div ng-repeat="section in newLeadModalCtrl.sections">
          <div ng-if="section.Id === 'null'">
            <forms model="newLeadModalCtrl.new_lead" fields="newLeadModalCtrl.forms[$index]" form="new_lead_form"></forms>
            <div class="gap-20"></div>
          </div>
          <div ng-if="section.Id !== 'null'" ng-hide="section.hidden">
            <modal-section section-form="new_lead_form" name="section.name" section-id="section.Id">
              <forms model="newLeadModalCtrl.new_lead" fields="newLeadModalCtrl.forms[$index]" form="new_lead_form" name="'section_form_' + section.Id"></forms>
            </modal-section>
            <div class="gap-20"></div>
          </div>
        </div>
      </section>
    </div>
  </modal-content>
  <modal-footer>
    <div class="side-wrapper stretch">
      <div class="hbox stretch">
        <aside class="v-middle">
          <button class="button button-action pull-right" ng-disabled="newLeadModalCtrl.loading" ng-click="newLeadModalCtrl.submitControl(newLeadModalCtrl.new_lead, new_lead_form)">Salvar</button>
          <loading-tooltip loading="newLeadModalCtrl.loading" form="new_lead_form"></loading-tooltip>
        </aside>
      </div>
    </div>
  </modal-footer>
</dynamic-modal>
