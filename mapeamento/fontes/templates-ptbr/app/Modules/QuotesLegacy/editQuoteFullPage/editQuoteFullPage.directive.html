<div class="vbox small-header" ng-form="edit_quote_form">
  <header>
    <div class="white-content b-b-1 side-wrapper height-40">
      <div class="hbox-flex stretch">
        <aside class="v-middle v-middle-flex">
          <div class="font-thin font-title big-simple-inline max-width-400 ellipsis align-middle nowrap">
            {{::editQuoteCtrl.getPageTitle()}}</div>
        </aside>
        <aside class="v-middle v-middle-flex text-right" ng-if="editQuoteCtrl.template_load">
          <div class="mini-side-wrapper mini-side-wrapper-flex">

            <div style="margin-left: 20px !important;" class="f-1">
              <a class="button button-white nowrap" ng-click="editQuoteCtrl.openModal()">
                <span class="text-action"><i class="button-icon fal fa-times"></i></span>
                Cancelar
              </a>
              <div ng-if="!editQuoteCtrl.hasPendingProducts && !editQuoteCtrl.display_no_templates && !editQuoteCtrl.formulaCalculating && !editQuoteCtrl.externalFormulaCalculating"
                class="button button-action position-relative pull-right width-110 full-page-loading-tooltip"
                ng-class="{ 'disabled': !editQuoteCtrl.can_load }"
                ng-click="editQuoteCtrl.applyQuote(editQuoteCtrl.edit_quote, edit_quote_form)">
                <i class="fas fa-save button-icon"></i>
                Salvar
                <loading-tooltip loading="!editQuoteCtrl.can_load" form="edit_quote_form" use-default-icon="true">
                </loading-tooltip>
              </div>

              <div ng-if="editQuoteCtrl.hasPendingProducts && !editQuoteCtrl.display_no_templates && !editQuoteCtrl.formulaCalculating && !editQuoteCtrl.externalFormulaCalculating"
                class="button button-action position-relative pull-right width-110 full-page-loading-tooltip"
                ng-class="{ 'disabled': !editQuoteCtrl.can_load }"
                ng-click-confirm="salvar? Há um ou mais produtos selecionados que não foram incluídos. Deseja continuar"
                ng-click="editQuoteCtrl.applyQuote(editQuoteCtrl.edit_quote, edit_quote_form)">
                <i class="fas fa-save button-icon"></i>
                Salvar
                <loading-tooltip loading="!editQuoteCtrl.can_load" form="edit_quote_form" use-default-icon="true">
                </loading-tooltip>
              </div>

              <div ng-if="editQuoteCtrl.formulaCalculating || editQuoteCtrl.externalFormulaCalculating"
                class="button button-action position-relative pull-right width-110 disabled full-page-loading-tooltip"
                uib-tooltip="Aguarde as fórmulas calcularem!"
                tooltip-append-to-body="true"
                tooltip-placement="bottom"
                >
                Aguarde
                <loading-tooltip loading="$ctrl.formulaCalculating || ctrl.externalFormulaCalculating" form="edit_quote_form" use-default-icon="true">
                </loading-tooltip>
              </div>
            </div>

            <a class="open-side-slide button pull-right nowrap" href
              ng-class="{ 'button-white-no-border': editQuoteCtrl.edit_quote && editQuoteCtrl.edit_quote.quote_deal[0] && editQuoteCtrl.edit_quote.quote_deal[0].deal_contact[0], 'button-light-background-border disabled anchor-contact-data-modal': !(editQuoteCtrl.edit_quote && editQuoteCtrl.edit_quote.quote_deal[0] && editQuoteCtrl.edit_quote.quote_deal[0].deal_contact[0]) }"
              ng-click="editQuoteCtrl.openDocumentEntityPreview()"
              ng-if="!editQuoteCtrl.display_no_templates">
              <span class="text-action"><i class="fal fa-id-card button-icon"></i></span>
              Dados do cliente
            </a>
            <div class="dropdown pull-right" ng-if="!editQuoteCtrl.display_no_templates">
              <a class="button button-white-no-border dropdown-toggle nowrap" data-toggle="dropdown">
                <span class="text-action"><i class="fal fa-file-image button-icon"></i></span>
                Modelo:
                {{editQuoteCtrl.selected_template.Name}}
                <i class="fal fa-angle-down dropdown-sign"></i>
              </a>
              <ul class="dropdown-menu white-dropdown-menu pull-right field-pick">
                <li ng-repeat="model in editQuoteCtrl.quote_templates track by model.Id"
                  ng-click="editQuoteCtrl.changeTemplate(model)"
                  ng-show="model.Id !== editQuoteCtrl.selected_template.Id && editQuoteCtrl.quote_templates.length > 1">
                  <a class="white-dropdown-link" href>{{model.Name}}</a>
                </li>
                <li ng-show="editQuoteCtrl.quote_templates.length === 1">
                  <a class="white-dropdown-link" href>Você tem apenas um modelo de proposta</a>
                </li>
              </ul>
            </div>
          </div>
        </aside>

      </div>
    </div>
  </header>
  <idle-cover start-idle="editQuoteCtrl.template_load" ng-if="!editQuoteCtrl.display_no_templates"></idle-cover>
  <no-templates ng-if="editQuoteCtrl.display_no_templates" entity-id="7"></no-templates>
  <section class="scrollable">
    <standard-loader margin-top="10" loading="!editQuoteCtrl.template_load"></standard-loader>
    <div class="top-wrapper" ng-if="!editQuoteCtrl.show_document_template_list">
      <forms model="editQuoteCtrl.edit_quote" editing-model="true" fields="editQuoteCtrl.selected_form"
        form="edit_quote_form" document-template-format="editQuoteCtrl.selected_template.NewFormat"
        ng-if="editQuoteCtrl.template_load && !editQuoteCtrl.show_document_template_list" is-modal-full-screen="true" use-new-product-section="true"
        ignore-default-values="editQuoteCtrl.ignoreDefaultValues" template-load="editQuoteCtrl.template_load"></forms>
    </div>
    <div class="regular-background min-height-100-percent" ng-if="editQuoteCtrl.show_document_template_list">
      <div class="width-700 margin-auto">
        <document-template-select entity-id="7" document-templates="editQuoteCtrl.quote_templates"
          select-document-template-callback-fn="editQuoteCtrl.changeTemplate(template)">
        </document-template-select>
      </div>
      <div class="gap-90 regular-background" ng-if="editQuoteCtrl.show_document_template_list"></div>
    </div>
    <div class="gap-90" ng-if="!editQuoteCtrl.show_document_template_list"></div>
    <div class="gap-90" ng-if="!editQuoteCtrl.show_document_template_list"></div>
    <div class="gap-90" ng-if="!editQuoteCtrl.show_document_template_list"></div>
  </section>
</div>
<document-entity-preview>
  <contact-entity-preview fields="editQuoteCtrl.selected_form" contact-id="editQuoteCtrl.api_quote.ContactId"></contact-entity-preview>
</document-entity-preview>
