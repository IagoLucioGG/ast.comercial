<dynamic-tabs
  ng-if="$ctrl.initial_load"
  entity="$ctrl.mainEntity"
  filter="$ctrl.table_filter"
  tabs="$ctrl.tabs"
  current-tab="$ctrl.currentTab"
  change-tab-callback="$ctrl.changeTabCallback(current_tab)"
  toggle-sidebar="$ctrl.tableSidebar"
  toggle-sidebar-callback="$ctrl.toggleSidebarCallback(toggle)"
  disable-inline-edit="$ctrl.disableInlineEdit"
  cypress-prefix="users-table"
></dynamic-tabs>
