<div ng-class="{'full-width': !noPullRight, 'button-after-text': buttonAfterText, 'attachments-badge-edit': attachmentsBadge }" class="data-edit v-overflow-hidden height-max text-break-word" ng-if="!hidePencil" ng-dblclick="inlineCtrl.openPopover(); $event.stopPropagation()">
  <span ng-transclude ng-class="{'full-width': !noPullRight && !buttonAfterText}"></span>
  <a ng-if="showExpandIcon && expandPopoverContent && !inlineCtrl.isOpen"
    class="button-fixed-size button-fixed-size-small inline-edit-icon all-in-center-flex edit-button"
    ng-class="{ 'inline-expand-icon': !inlineCtrl.expandPopoverIsOpen, 'data-edit-in-use': inlineCtrl.expandPopoverIsOpen }"
    ng-click="inlineCtrl.openExpandPopover(); $event.stopPropagation()"
    uib-popover-template="inlineCtrl.expandPopoverTemplate" popover-append-to-body="true"
    popover-class="{{inlineCtrl.uniq_class_popover}} {{inlineCtrl.popoverSize}}"
    popover-placement="auto bottom" popover-is-open="inlineCtrl.expandPopoverIsOpen"
    data-cy="{{cypressString}}">
    <i class="fal fa-arrow-up-right-and-arrow-down-left-from-center"></i>
  </a>
  <a ng-if="!isOnLibrary && !nonEditable && !inlineCtrl.expandPopoverIsOpen"
    class="button-fixed-size button-fixed-size-small inline-edit-icon all-in-center-flex edit-button relative-button"
    ng-class="{ 'data-edit-in-use': inlineCtrl.isOpen, 'align-button': attachmentsBadge }" ng-click="inlineCtrl.openPopover(); $event.stopPropagation()"
    uib-popover-template="inlineCtrl.popoverTemplate" popover-title="{{ inlineCtrl.popoverTitle }}"
    popover-class="{{inlineCtrl.uniq_class_popover}} {{inlineCtrl.popoverSize}}"
    popover-append-to-body="true"
    popover-placement="{{ inlineCtrl.zoomPixelDensity ? 'left' : popoverPlacement || 'auto right' }}"
    popover-is-open="inlineCtrl.isOpen">
    <i class="fal fa-pen"></i>
  </a>
  <a ng-if="isOnLibrary && !nonEditable && !inlineCtrl.expandPopoverIsOpen"
    class="button-fixed-size button-fixed-size-small inline-edit-icon all-in-center-flex edit-button"
    ng-class="{ 'data-edit-in-use': inlineCtrl.isOpen }" ng-click="inlineCtrl.openPopover(); $event.stopPropagation()"
    uib-popover-template="inlineCtrl.libraryPopoverTemplate" popover-title="{{ inlineCtrl.popoverTitle }}"
    popover-class="{{inlineCtrl.uniq_class_popover}}"
    popover-append-to-body="true"
    popover-placement="{{ inlineCtrl.zoomPixelDensity ? 'left' : popoverPlacement || 'auto right' }}"
    popover-is-open="inlineCtrl.isOpen"
    data-cy="{{cypressString}}">
    <i class="fal fa-pen"></i>
  </a>
</div>

<div class="data-edit block-alert" ng-if="hidePencil">
  <a ng-if="blockAlert && blockAlert !== ''" class="button-fixed-size button-fixed-size-small inline-edit-icon ban-owner-edit-icon"
    uib-tooltip="{{ blockAlert }}"
    tooltip-append-to-body="true">
    <i class="fal fa-ban activity-icon-top-3"></i>
  </a>
  <a href ng-if="!nonEditable" ng-click="inlineCtrl.openPopover(); $event.stopPropagation()"
    uib-popover-template="inlineCtrl.popoverTemplate" popover-title="Editar" popover-append-to-body="true"
    popover-placement="{{ inlineCtrl.zoomPixelDensity ? 'right' : popoverPlacement || 'auto right' }}" popover-is-open="inlineCtrl.isOpen"
    popover-class="{{inlineCtrl.popoverSize}}">
    <span ng-transclude></span>
  </a>
  <span ng-if="nonEditable">
    <span ng-transclude></span>
  </span>
</div>


<script type="text/ng-template" id="library-popover">
  <div ng-if="inlineCtrl.isOpen" ng-form name="inline_edit_form">
    <form ng-if="inlineCtrl.loading_model">
      <div class="loader modal-loader inline-edit-loader"></div>
    </form>
    <forms
      ng-if="!inlineCtrl.loading_model"
      model="inlineCtrl.modelCopy"
      fields="inlineCtrl.fields"
      not-trigger-formula="notTriggerFormula"
      form="inline_edit_form"
      is-inline-form="true"
      >
    </forms>
    <mdm-duplicates-watcher
      ng-if="!inlineCtrl.loading_model"
      model="inlineCtrl.modelCopy"
      forms="inlineCtrl.mdmFields"
      contact-type="inlineCtrl.mdmContactType">
    </mdm-duplicates-watcher>
    <div class="d-flex inline-footer-gap justify-content-start align-items-center">
      <button class="button button-action mleft15" ng-disabled="{{ inlineCtrl.saveDisabled || inlineCtrl.loading }}" ng-click="inlineCtrl.submit(inline_edit_form); $event.stopPropagation()" title="Submit" aria-label="Submit" data-cy="inline-edit-save-btn">Salvar</button>
      <button class="button button-white" ng-disabled="inlineCtrl.loading" ng-click="inlineCtrl.cancel(); $event.stopPropagation()" title="Cancel" aria-label="Cancel">Cancelar</button>
      <loading-tooltip loading="inlineCtrl.loading" form="inline_edit_form"></loading-tooltip>
    </div>
  </div>
</script>

<script type="text/ng-template" id="popover">
  <div ng-if="inlineCtrl.isOpen" ng-form name="inline_edit_form">
    <form ng-if="inlineCtrl.loading_model">
      <div class="loader modal-loader inline-edit-loader"></div>
    </form>
    <div class="wrapper-inline-edit-form-{{inlineCtrl.uniq_class_popover}}">
      <forms
        ng-if="!inlineCtrl.loading_model"
        model="inlineCtrl.modelCopy"
        fields="inlineCtrl.fields"
        not-trigger-formula="notTriggerFormula"
        form="inline_edit_form"
        is-inline-form="true"
        ignore-default-values="true"
        ng-init="inlineCtrl.onInitForms()"
      >
      </forms>
      <mdm-duplicates-watcher
        ng-if="!inlineCtrl.loading_model"
        model="inlineCtrl.modelCopy"
        forms="inlineCtrl.mdmFields"
        contact-type="inlineCtrl.mdmContactType">
      </mdm-duplicates-watcher>
    </div>
    <div class="d-flex inline-footer-gap justify-content-start align-items-center">
      <button class="button button-action mleft15" ng-disabled="{{ inlineCtrl.saveDisabled || inlineCtrl.loading }}" ng-click="inlineCtrl.submit(inline_edit_form); $event.stopPropagation()" title="Submit" aria-label="Submit">Salvar</button>
      <button class="button button-white" ng-disabled="inlineCtrl.loading" ng-click="inlineCtrl.cancel(); $event.stopPropagation()" title="Cancel" aria-label="Cancel">Cancelar</button>
      <loading-tooltip loading="inlineCtrl.loading" form="inline_edit_form"></loading-tooltip>
    </div>
  </div>
</script>

<script type="text/ng-template" id="expand-popover">
  <div ng-if="inlineCtrl.expandPopoverIsOpen" class="expand-popover">
    <div ng-if="inlineCtrl.new_sanitize_front" class="expand-popover-content" ng-bind-html="inlineCtrl.sanitizeHTML(expandPopoverContent) | to_trusted"></div>
    <div ng-if="!inlineCtrl.new_sanitize_front" class="expand-popover-content" ng-bind-html="expandPopoverContent | to_trusted"></div>
    <button class="button button-white expand-close-button" ng-click="inlineCtrl.closeExpandPopover(); $event.stopPropagation()" title="Close" aria-label="Close">Fechar</button>
  </div>
</script>
