  <single-address-select-wrapper ng-if="$ctrl.field.typeId === 17" select-place-callback-fn="$ctrl.selectPlaceCallbackFn" model="$ctrl.model" set-address-value-callback-fn="$ctrl.setAddressValueCallbackFn" field="$ctrl.field" disabled="$ctrl.disabled || !$ctrl.field.valueEditable" is-inline-form="$ctrl.isInlineForm" required="$ctrl.required && $ctrl.field.applyRequiredFieldRules" data-cy="{{'field-key-' + $ctrl.field.key}}"></single-address-select-wrapper>

  <!-- case field is image -->
  <image-field ng-if="$ctrl.field.typeId === 18" model="$ctrl.model[$ctrl.property]" field="$ctrl.field" required="$ctrl.required && $ctrl.field.applyRequiredFieldRules" disabled="$ctrl.disabled || !$ctrl.field.valueEditable" label="{{$ctrl.field.label}}"></image-field>

  <!-- case field is attachment -->
  <attachment-field ng-if="$ctrl.field.typeId === 19" model="$ctrl.model[$ctrl.property]" field="$ctrl.field" required="$ctrl.required && $ctrl.field.applyRequiredFieldRules" disabled="$ctrl.disabled || !$ctrl.field.valueEditable" label="{{$ctrl.field.label}}" is-inline-form="$ctrl.isInlineForm" data-cy="{{'field-key-' + $ctrl.field.key}}" aria-label="{{ 'ARIA_LABELS.FIELD.ATTACHMENTS' | translate_with_replace: { fieldLabel: $ctrl.field.label } }}"></attachment-field>

  <!-- case field is color select -->
  <input ng-if="($ctrl.field.typeId === 1 && $ctrl.field.key.includes('color')) || $ctrl.field.typeId === 20" ng-model="$ctrl.model[$ctrl.property]" ng-required="$ctrl.required && $ctrl.field.applyRequiredFieldRules" ng-disabled="$ctrl.disabled || !$ctrl.field.valueEditable" name="{{$ctrl.field.key}}" colorpicker="hex" class="form-control input-sm" ng-style="{ 'background-color': $ctrl.model[$ctrl.property] }" ng-change="$ctrl.fieldChanges($ctrl.field, $ctrl.model)"/>

  <!-- case field is date (in filters) -->
  <relative-date ng-if="$ctrl.field.key.includes('_relative')" field="$ctrl.field" model="$ctrl.model[$ctrl.property]" required="$ctrl.required && $ctrl.field.applyRequiredFieldRules" disabled="$ctrl.disabled || !$ctrl.field.valueEditable" model-change-callback="$ctrl.fieldChanges($ctrl.field, $ctrl.model)" parent-model="$ctrl.model" data-cy="{{'field-key-' + $ctrl.field.key}}"></relative-date>
  <!-- case field is repeat interval unit -->
  <repeat-interval ng-if="$ctrl.field.type === 'Intervalo da repetição'" model="$ctrl.model[$ctrl.property]" api-url="{{$ctrl.field.apiUrl}}" required="$ctrl.required && $ctrl.field.applyRequiredFieldRules" disabled="$ctrl.disabled || !$ctrl.field.valueEditable" data-cy="{{'field-key-' + $ctrl.field.key}}"></repeat-interval>
  <!-- case field is duration -->
  <duration ng-if="$ctrl.field.type === 'Duração'" model="$ctrl.model[$ctrl.property]" api-url="{{$ctrl.field.apiUrl}}" required="$ctrl.required && $ctrl.field.applyRequiredFieldRules" disabled="$ctrl.disabled || !$ctrl.field.valueEditable" data-cy="{{'field-key-' + $ctrl.field.key}}"></duration>
  <!-- case field is email reminder -->
  <email-reminder ng-if="$ctrl.field.type === 'Lembrete por Email'" model="$ctrl.model[$ctrl.property]" api-url="{{$ctrl.field.apiUrl}}" required="$ctrl.required && $ctrl.field.applyRequiredFieldRules" disabled="$ctrl.disabled || !$ctrl.field.valueEditable" data-cy="{{'field-key-' + $ctrl.field.key}}"></email-reminder>
  <!-- case field is calendar invite -->
  <calendar-invite ng-if="$ctrl.field.type === 'Enviar Convite'" model="$ctrl.model[$ctrl.property]" required="$ctrl.required && $ctrl.field.applyRequiredFieldRules" disabled="$ctrl.disabled || !$ctrl.field.valueEditable" hide-label="$ctrl.hideLabel" data-cy="{{'field-key-' + $ctrl.field.key}}"></calendar-invite>
  <!-- case field is currency -->
  <currency-field ng-if="$ctrl.field.type === 'Currencia'" model="$ctrl.model[$ctrl.property]" required="$ctrl.required && $ctrl.field.applyRequiredFieldRules" disabled="$ctrl.disabled || !$ctrl.field.valueEditable" label="{{$ctrl.field.label}}" data-cy="{{'field-key-' + $ctrl.field.key}}"></currency-field>
  <!-- case field is deal actions -->
  <deal-actions ng-if="$ctrl.field.key === 'deal_actions'" model="$ctrl.model" label="{{$ctrl.field.label}}" data-cy="{{'field-key-' + $ctrl.field.key}}"></deal-actions>
  <!-- case field is installment fixed -->
  <div class="switch" ng-if="$ctrl.field.key.includes('_installment_fixed')">
      <input id="{{$ctrl.unique_id}}" ng-model="$ctrl.model[$ctrl.property]" ng-checked="$ctrl.model[$ctrl.property] === true" class="cmn-toggle cmn-toggle-round-flat" type="checkbox" ng-change="$ctrl.fieldChanges($ctrl.field, $ctrl.model)" data-cy="{{'field-key-' + $ctrl.field.key}}">
      <label for="{{$ctrl.unique_id}}"></label>
  </div>
  <!-- case field is bool with checkbox -->
  <div ng-if="$ctrl.field.typeId === 10 && $ctrl.field.type !== 'Enviar Convite' && !$ctrl.field.key.includes('_installment_fixed') && !$ctrl.field.key.includes('has_consent') && $ctrl.field.useCheckboxBox">
      <div class="hbox">
          <aside class="v-middle">
              <label
                for="$ctrl.unique_id"
                class="font-semi-big"
                ng-if="!$ctrl.forceHideLabel && !$ctrl.hideLabel && $ctrl.field.key.includes('_product')">
                {{$ctrl.field.label}}
              </label>
              <label for="$ctrl.unique_id" ng-show="!$ctrl.field.key.includes('_product') && !$ctrl.forceHideLabel">
                {{$ctrl.field.label}}
                <img ng-if="$ctrl.field.isAiField" src="assets/images/ai-assistant-logo.svg" class="ai-field-label-icon" />
              </label>
              <div
                class="gap-10"
                ng-if="!$ctrl.forceHideLabel && !$ctrl.hideLabel && $ctrl.field.key.includes('_products') && !$ctrl.field.key.includes('contact')"></div>
              <div class="switch" ng-class="{disabled: $ctrl.disabled || !$ctrl.field.valueEditable}">
                <input
                  id="{{$ctrl.unique_id}}"
                  type="checkbox"
                  class="cmn-toggle"
                  ng-class="$ctrl.field.isAiField ? 'cmn-toggle-round-flat-ai-transcription-prompt' : 'cmn-toggle-round-flat'"
                  ng-model="$ctrl.model[$ctrl.property]"
                  ng-change="$ctrl.fieldChanges($ctrl.field, $ctrl.model)"
                  ng-required="$ctrl.required && $ctrl.field.applyRequiredFieldRules"
                  ng-disabled="$ctrl.disabled || !$ctrl.field.valueEditable"
                  data-cy="{{'field-key-' + $ctrl.field.key}}"
                  aria-label="{{ 'ARIA_LABELS.FIELD.CHECKBOX' | translate_with_replace: { fieldLabel: $ctrl.field.label } }}"
                >
                <label
                  for="{{$ctrl.unique_id}}"
                  uib-tooltip="{{ ($ctrl.model[$ctrl.property] == null ? 'GENERICS.EMPTY' : ($ctrl.model[$ctrl.property] ? 'GENERICS.YES' : 'GENERICS.NO')) | translate }}"
                  tooltip-append-to-body="true"
                  ng-class="{'mx-auto': $ctrl.field.key.includes('_product') && !$ctrl.field.key.includes('contact')}"
                ></label>
              </div>
          </aside>
      </div>
  </div>
  <small class="text-warning" ng-if="$ctrl.repeated_name">
    Já existe um campo com esse nome!
  </small>

  <!-- case field is has consent -->
  <contact-has-consent
    ng-if="$ctrl.field.typeId === 10 && $ctrl.field.key.includes('has_consent')"
    field="$ctrl.field"
    model="$ctrl.model[$ctrl.property]"
    required="$ctrl.required && $ctrl.field.applyRequiredFieldRules"
    disabled="$ctrl.disabled || !$ctrl.field.valueEditable">
  </contact-has-consent>
</span>

<!-- case field is developer type -->
<a ng-if="$ctrl.field.typeId === 22 && $ctrl.dev_field_hlimit_overflow" class="button-fixed-size button-fixed-size-small button-white pull-right b-1 expand-developer-field-button" ng-click="$ctrl.toggleDeveloperMaxHeight()" ng-class="{ 'expand-developer-field-button-offset': !$ctrl.dev_vertical_bar_offset }"><i class="fal" ng-class="{ 'fa-arrow-up-right-and-arrow-down-left-from-center': $ctrl.developer_field_max_height, 'fa-arrow-down-left-and-arrow-up-right-to-center': !$ctrl.developer_field_max_height }"></i></a>
<iframe id="{{::$ctrl.developer_field_element_iframe_id}}" ng-if="$ctrl.field.typeId === 22" class="developer-field" ng-class="{ 'developer-field-max-height': $ctrl.developer_field_max_height }" data-cy="{{'field-key-' + $ctrl.field.key}}"></iframe>
