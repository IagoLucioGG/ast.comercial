<div class="hbox">
  <aside>
    <label>
      Senha
    </label>
    <input class="form-control input-sm" type="password" autocomplete="chrome-off" ng-model="$ctrl.model" ng-change="$ctrl.checkModelValidity()">
  </aside>
</div>
<div class="hbox mtop10">
  <aside>
    <label>
      Confirmar senha
    </label>
    <input class="form-control input-sm" type="password" autocomplete="chrome-off" ng-model="$ctrl.confirm_password" ng-change="$ctrl.checkModelValidity()">
  </aside>
</div>
<div class="hbox mtop10 text-left" ng-if="$ctrl.errors.length > 0">
  <aside>
    <div class="font-bold">
      Os seguintes erros foram encontrados:
    </div>
    <ul>
      <li ng-repeat="error in $ctrl.errors">
        {{error}}
      </li>
    </ul>
  </aside>
</div>
