<dynamic-modal
  modal-id="users"
  footer="false"
  wider="true"
  dark="true"
  modal-title="{{ 'INTEGRATIONS.USERS_ADM.TITLE' | translate }}"
  toggle-modal="integrationUsersCtrl.toggle_modal"
  has-general-slide="user_slide"
  cypress-prefix="administration-integration-users-modal"
  is-fetching-modal-content="integrationUsersCtrl.isFetchingModalContent"
>
  <modal-content>
    <div class="vbox">
      <section class="scrollable scroll-shadow-container">
        <div class="vbox side-scroll small-header">
          <header class="regular-header new-header b-b-1">
            <div class="hbox stretch">
              <aside class="v-middle">
                <div class="simple-inline width-200 v-bottom">
                  <div class="input-group">
                    <input class="form-control input-sm light-background" placeholder="{{ 'INTEGRATIONS.USERS_ADM.PLACEHOLDER' | translate }}" ng-model="integrationUsersCtrl.user_name_filter" ng-change="integrationUsersCtrl.filterUsers()" ng-model-options="{debounce:300}">
                    <div class="input-group-btn">
                      <a class="btn button button-neutral-gray special-search-button">
                        <i class="fas fa-search text-neutral"></i>
                      </a>
                    </div>
                  </div>
                </div>
                <!-- <div class="simple-inline width-120">
                  <input class="form-control input-sm light-background" date datepicker="true" placeholder="A partir de" ng-model="integrationUsersCtrl.user_frequency_min_filter" ng-change="integrationUsersCtrl.filterUsers()" ng-model-options="{debounce:300}">
                </div>
                <div class="simple-inline width-120">
                  <input class="form-control input-sm light-background" date datepicker="true" placeholder="Até" ng-model="integrationUsersCtrl.user_frequency_max_filter" ng-change="integrationUsersCtrl.filterUsers()" ng-model-options="{debounce:300}">
                </div> -->
              </aside>
              <aside class="v-middle">
                <a class="button button-action pull-right" ng-click="integrationUsersCtrl.newUserSlide()" data-cy="administration-integration-users-new-user-button">
                  <i class="button-icon fas fa-user-astronaut"></i>
                  {{ 'INTEGRATIONS.USERS_ADM.NEW_USER' | translate }}
                </a>
              </aside>
            </div>
          </header>
          <section class="scrollable">
            <div>
              <table class="table table-hover white-table">
                <thead>
                  <tr>
                    <th class="small-cell cursor-pointer" ng-click="integrationUsersCtrl.sortBy('Name')">
                      {{ 'INTEGRATIONS.USERS_ADM.NAME' | translate }}
                      <i ng-if="integrationUsersCtrl.sort_column === 'Name'" class="fas m-l-xs" ng-class="integrationUsersCtrl.sort_reverse ? 'fa-sort-amount-down' : 'fa-sort-amount-up'"></i>
                    </th>
                    <th class="cursor-pointer" ng-click="integrationUsersCtrl.sortBy('Email')">
                      {{ 'INTEGRATIONS.USERS_ADM.EMAIL' | translate }}
                      <i ng-if="integrationUsersCtrl.sort_column === 'Email'" class="fas m-l-xs" ng-class="integrationUsersCtrl.sort_reverse ? 'fa-sort-amount-down' : 'fa-sort-amount-up'"></i>
                    </th>
                    <th class="cursor-pointer nowrap" ng-click="integrationUsersCtrl.sortBy('Suspended')">
                      {{ 'INTEGRATIONS.USERS_ADM.ACTIVE?' | translate }}
                      <i ng-if="integrationUsersCtrl.sort_column === 'Suspended'" class="fas m-l-xs" ng-class="integrationUsersCtrl.sort_reverse ? 'fa-sort-amount-down' : 'fa-sort-amount-up'"></i>
                    </th>
                  </tr>
                </thead>
                <tbody>
                  <tr class="contact-workplace-button" ng-repeat="user in integrationUsersCtrl.users | filter:{Show: true} | orderBy:integrationUsersCtrl.sort_column:integrationUsersCtrl.sort_reverse" ng-click="integrationUsersCtrl.editUserSlide(user)" data-cy="integration-user-{{user.Id}}">
                    <td>
                      <img class="mini-avatar-less" ng-src="{{user.AvatarUrl}}">
                      <span class="font-bold">{{user.Name}}</span>
                    </td>
                    <td>
                      {{user.Email}}
                    </td>
                    <td>
                      {{ (user.Suspended ? 'GENERICS.NO' : 'GENERICS.YES') | translate }}
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>
        </div>
      </section>
    </div>
  </modal-content>
  <modal-side-slide slide-id="user_slide" modal-side-slide-title="{{ 'INTEGRATIONS.USERS_ADM.MODAL_SIDE_SLIDE_TITLE' | translate }}" cypress-prefix="administration-integration-users-new-user-title">
    <users-adm-slide-content model="integrationUsersCtrl.model" editing="integrationUsersCtrl.editing" integration-user="true"></users-adm-slide-content>
  </modal-side-slide>
</dynamic-modal>
