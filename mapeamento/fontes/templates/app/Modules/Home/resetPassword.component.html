<dynamic-modal modal-id="{{::modalId}}"
  wide="false"
  footer="true"
  dark="true"
  modal-title="{{ 'RESET_PASSWORD.TITLE' | translate }}"
  toggle-modal="$ctrl.toggle_modal"
  skip-height="true"
  disable-close-modal="true"
>
  <modal-content>
    <section class="scrollable scroll-shadow-container">
      <div class="wrapper">
        <password-input model="$ctrl.password" is-password-valid="$ctrl.is_password_valid">
      </div>
    </section>
  </modal-content>
  <modal-footer>
    <div class="side-wrapper stretch">
      <div class="hbox stretch">
        <aside class="v-middle">
          <button class="button button-action pull-right" ng-disabled="$ctrl.loading" ng-click="$ctrl.submitControl()">
            {{ 'RESET_PASSWORD.TITLE' | translate }}
          </button>
          <button ng-if="$ctrl.allowCancel" class="button button-white pull-right" ng-disabled="$ctrl.loading" ng-click="$ctrl.returnToPreviousRoute()">
            {{ 'GENERICS.CANCEL' | translate }}
          </button>
          <loading-tooltip loading="$ctrl.loading"></loading-tooltip>
        </aside>
      </div>
    </div>
  </modal-footer>
</dynamic-modal>
