<dynamic-modal
  helper-key="'TABLE_NEW_TAB'"
  modal-id="{{modalId}}"
  wide="true"
  footer="true"
  dark="true"
  modal-title="{{ (tab.filterObject ? 'DYNAMIC_TABLE.EDIT_TAB' : 'DYNAMIC_TABLE.NEW_TAB') | translate }}"
  ng-form="new_tab_form"
  block-back-state="true"
  toggle-modal="toggleModal"
  cypress-prefix="dynamic-tabs-filter"
  is-fetching-modal-content="dynamicTabsFilterCtrl.isFetchingModalContent"
>
    <modal-content>
        <div class="vbox scroll-shadow neutral-shadow">
            <section class="scrollable scroll-shadow-container">
              <div class="modal-body-no-padding">
            <div class="gap-15"></div>
            <form class="clearfix">
              <div class="form-group col-sm-12">
                <label>
                  {{ 'DYNAMIC_TABLE.TAB_NAME_FIELD_LABEL' | translate }}
                </label>
                <span class="align-limited-characters">
                  <span class="text-muted font-small">
                    {{ dynamicTabsFilterCtrl.filterObject.filter_name.length || 0 }}/{{ dynamicTabsFilterCtrl.tab_name_max_length }}
                  </span>
                </span>
                <div ng-class="new_tab_form.$submitted && new_tab_form.$error.required[0].$error.required[0] && 'invalid-input'">
                  <input 
                    id="tab_name" 
                    class="form-control input-sm" 
                    data-cy="dynamic-tabs-filter-tab-name"
                    ng-model="dynamicTabsFilterCtrl.filterObject.filter_name" 
                    ng-change="dynamicTabsFilterCtrl.getFieldLength()" 
                    maxlength="{{ dynamicTabsFilterCtrl.tab_name_max_length }}" 
                    aria-label="{{ 'DYNAMIC_TABLE.TAB_NAME_FIELD_LABEL' | translate }}"
                    ng-required="true" 
                  >
                </div>
              </div>
              <div class="form-group col-sm-12">
                <label>
                  {{ 'DYNAMIC_TABLE.ITEMS_PER_PAGE_FIELD_LABEL' | translate }}
                </label>
                <div>
                  <input 
                    type="number" 
                    class="form-control input-sm" 
                    data-cy="dynamic-tabs-filter-items-per-page"
                    ng-model="dynamicTabsFilterCtrl.filterObject.items_per_page" 
                    aria-label="{{ 'DYNAMIC_TABLE.ITEMS_PER_PAGE_FIELD_LABEL' | translate }}"
                  >
                </div>
              </div>
              <allowed-users model="dynamicTabsFilterCtrl.filterObject" title="('DYNAMIC_TABLE.TAB_VIEW_PERMISSION' | translate)"></allowed-users>
            </form>
            <div class="filter-group-container" ng-if="dynamicTabsFilterCtrl.filter_compare_fields">
              <div class="header">
                <i class="fas fa-filter"></i>
                <span>{{ 'FILTERS.FILTERS' | translate }}</span>
                <filter-clipboard-bar filter-fields="dynamicTabsFilterCtrl.filterFields"></filter-clipboard-bar>
              </div>
              <div class="content">
                <filter-container 
                  entity="entity" 
                  query-object="dynamicTabsFilterCtrl.filterObject"
                  filter-fields="dynamicTabsFilterCtrl.filterFields"
                  update-filter-fields="dynamicTabsFilterCtrl.updateFilterFields(filterFields)"
                  compare-fields="true"
                ></filter-container>
              </div>
            </div>
            <div ng-if="!dynamicTabsFilterCtrl.filter_compare_fields">
              <filter-container 
                entity="entity" 
                query-object="dynamicTabsFilterCtrl.filterObject"
                filter-fields="dynamicTabsFilterCtrl.filterFields"
                update-filter-fields="dynamicTabsFilterCtrl.updateFilterFields(filterFields)"
                compare-fields="true"
              ></filter-container>
            </div>
            </div>
            </section>
        </div>
    </modal-content>
    <modal-footer>
        <aside class="v-middle text-left">
          <a
            href
            ng-if="tab && tab.filterObject"
            class="button button-white"
            data-cy="dynamic-tabs-filter-delete-tab"
            ng-click="dynamicTabsFilterCtrl.deleteTab(tab)"
            reversible="false"
            aria-label="{{ 'ARIA_LABELS.TABLES.DELETE_TAB_BUTTON' | translate_with_replace: { tabId: tab.Id } }}"
            ng-click-confirm="{{::('DYNAMIC_TABLE.CONFIRM_TAB_DELETE' | translate)}} &quot;{{dynamicTabsFilterCtrl.filterObject.filter_name}}&quot;?"
          >
            <span class="font-big">
              <i class="fal fa-trash"></i>
            </span>
          </a>
        </aside>
        <div class="modal-footer-wrapper height-max">
          <loading-tooltip loading="dynamicTabsFilterCtrl.loading" form="new_tab_form" danger="(!dynamicTabsFilterCtrl.valid_views) || (new_tab_form.$submitted && dynamicTabsFilterCtrl.filterObject.condition_list[0].query_object.length === 0)"></loading-tooltip>
          <button 
            href 
            class="btn button button-action btn-sm pull-right" 
            data-cy="dynamic-tabs-filter-btn-save"
            ng-click="dynamicTabsFilterCtrl.submitControl(dynamicTabsFilterCtrl.filterObject, new_tab_form, false)" 
            aria-label="{{ tab.filterObject ? 'ARIA_LABELS.SAVE_BUTTON' : 'ARIA_LABELS.TABLES.CREATE_TAB_BUTTON' | translate }}"
          >
            <i class="fas fa-save button-icon"></i>
            {{ (tab.filterObject ? 'GENERICS.SAVE' : 'DYNAMIC_TABLE.CREATE_TAB') | translate }}
          </button>
          <!--<button ng-if="!tab.filterObject" ng-click="dynamicTabsFilterCtrl.submitControl(dynamicTabsFilterCtrl.filterObject, new_tab_form, false, true)" href class="btn button button-white btn-sm pull-right" uib-tooltip="{{ 'DYNAMIC_TABLE.CREATE_TAB_WITHOUT_FILTER_HELPER' | translate }}">
            <i class="fal fa-save button-icon"></i>
            {{ 'DYNAMIC_TABLE.CREATE_TAB_WITHOUT_FILTER' | translate }}
          </button> -->
        </div>
    </modal-footer>
</dynamic-modal>
