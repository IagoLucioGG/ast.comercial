<div class="dropdown pull-right">
  <div 
    class="button-fixed-size button-fixed-size-small data-edit-button dropdown-toggle special-cog-button" 
    ng-if="enableConfigTabOptions" 
    data-cy="dynamic-tabs-options-tab-actions"
    ng-class="{ 'is-blocked': dynamicTabsOptionsCtrl.isBlocked }"
    ng-click="!dynamicTabsOptionsCtrl.isBlocked && dynamicTabsOptionsCtrl.openedDropdown()"
    aria-label="{{ 'ARIA_LABELS.TABLES.TAB_ACTIONS_BUTTON' | translate_with_replace: { tabId: frontTab.Id } }}"
    data-toggle="{{ dynamicTabsOptionsCtrl.isBlocked ? null : 'dropdown' }}"
    uib-tooltip="{{ dynamicTabsOptionsCtrl.isBlocked 
        ? ('DYNAMIC_TABLE.NO_PERMISSION' | translate) 
        : ('DYNAMIC_TABLE.TAB_ACTIONS' | translate) }}"
    tooltip-append-to-body="true" 
  >
    <i class="fal fa-cog font-semi-big fixing-fixed-size-button"
      ng-mouseenter="hoverIcon = true"
      ng-mouseleave="hoverIcon = false"
      ng-style="dynamicTabsOptionsCtrl.isBlocked ? (hoverIcon ? {'cursor': 'not-allowed', 'opacity': '0.5'} : {'cursor': 'not-allowed'}) : {}">
    </i>
  </div>
    <ul class="dropdown-menu white-dropdown-menu pull-right no-padding-top">
      <div class="dropdown-subtitle">
        {{ 'DYNAMIC_TABLE.TAB_ACTIONS' | translate }}
      </div>
      <li ng-repeat="option in dynamicTabsOptionsCtrl.options">
        <a 
          href 
          class="white-dropdown-link font-regular-weight" 
          data-cy="{{ 'dynamic-tabs-options-action-' + option.DataCy }}"
          ng-click="option.ClickFunction()" 
          aria-label="{{option.AriaLabel}}" 
        >
          <div class="hbox">
            <aside class="v-middle width-25 text-center">
              <span class="text-neutral">
                <i class="list-simple-line" ng-class="option.Icon"></i>
              </span>
            </aside>
            <aside class="v-middle">
             {{option.Name}}
            </aside>
          </div>
        </a>
      </li>
      <li ng-if="dynamicTabsOptionsCtrl.can_integrate_mailchimp && entity.Id === 1 && frontTab.Editable">
        <a
          class="white-dropdown-link font-regular-weight"
          ng-if="(dynamicTabsOptionsCtrl.hasNewMailchimpIntegration && !dynamicTabsOptionsCtrl.isTabIntegratedToMailchimp) || (!dynamicTabsOptionsCtrl.hasNewMailchimpIntegration && !frontTab.mailChimpListIntegration)"
          href
          ng-click="dynamicTabsOptionsCtrl.integrateTabToMailChimp(frontTab); $event.stopPropagation();"
          ng-mouseover="dynamicTabsOptionsCtrl.hoverChimp = true"
          ng-mouseout="dynamicTabsOptionsCtrl.hoverChimp = false">

            <aside class="v-middle width-25 min-width-25">
