<div class="loader modal-loader" ng-class="{'pull-right': !skipPullRight}" ng-if="loading"></div>
<span class="font-very-big" ng-class="loadingTooltipCtrl.errorIconClass()" ng-if="form && form.$submitted && form.$invalid && (useDefaultIcon || (!form.$error.required && !loadingTooltipCtrl.uniqueViolation()))" type="button" tooltip-placement="top" uib-tooltip="{{loadingTooltipCtrl.errorMessage()}}">
  <i class="fad fa-exclamation-triangle"></i>
</span>
<span class="alert-message" ng-class="loadingTooltipCtrl.errorIconClass()" ng-if="form && form.$submitted && form.$invalid && !useDefaultIcon">
  <div ng-if="form.$error.required || invalidOptions" data-cy="loading-tooltip-required-fields"><i class="fad fa-exclamation-circle"></i> {{ 'FORMS.LOADING_TOOLTIP.REQUIRED_FIELDS' | translate }}</div>
  <div ng-if="loadingTooltipCtrl.uniqueViolation()"><i class="fad fa-exclamation-circle"></i> {{ 'FORMS.LOADING_TOOLTIP.KEY_FIELD_ERROR' | translate }}</div>
</span>
